[project]
name = "traffic-vision"
version = "0.1.0"
description = "Local-first traffic video analytics with YOLO11 and Streamlit"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
